<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Folk's Retreat</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Folk's Retreat" />
    <meta name="theme-color" content="#f5ede0" />
    <style>
      @font-face { font-family: 'ThmanyahSans'; src: url('/thmanyahsans-Regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
      @font-face { font-family: 'ThmanyahSans'; src: url('/thmanyahsans-Medium.woff2') format('woff2'); font-weight: 500; font-display: swap; }
      @font-face { font-family: 'ThmanyahSans'; src: url('/thmanyahsans-Bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }
      @font-face { font-family: 'ThmanyahSans'; src: url('/thmanyahsans-Black.woff2') format('woff2'); font-weight: 900; font-display: swap; }
      @font-face { font-family: 'ThmanyahSerif'; src: url('/thmanyahserifdisplay-Regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
      @font-face { font-family: 'ThmanyahSerif'; src: url('/thmanyahserifdisplay-Bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }
      @font-face { font-family: 'ThmanyahSerif'; src: url('/thmanyahserifdisplay-Black.woff2') format('woff2'); font-weight: 900; font-display: swap; }
    </style>
  <script>
    (() => {
      let dark = false;
      try { dark = localStorage.getItem('fr_theme') === 'dark'; } catch { /* Use light when storage is unavailable. */ }
      const color = dark ? '#211f1c' : '#f5ede0';
      document.documentElement.style.setProperty('--startup-bg', color);
      document.documentElement.style.background = color;
      document.querySelector('meta[name="theme-color"]').setAttribute('content', color);
    })();
  </script>
  <style>body { background: transparent; margin: 0; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
